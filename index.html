<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>電子繪本</title>
<style>
  :root {
    --night: #15131c;
    --night-2: #221e2b;
    --ember: #e0a43a;
    --paper: #f3ead8;
    --muted: #9a93a6;
    --ui-h: 76px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(ellipse at 50% 35%, var(--night-2), var(--night) 70%);
    color: var(--paper);
    font-family: "Noto Serif TC", "PMingLiU", "Songti TC", serif;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  #app {
    height: 100%;
    display: grid;
    grid-template-rows: 1fr var(--ui-h);
    padding-top: env(safe-area-inset-top, 0px);
  }

  /* ---- page stage ---- */
  #stage {
    position: relative;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 12px 12px 0;
  }
  #page {
    max-width: 100%;
    max-height: 100%;
    aspect-ratio: 4 / 3;
    object-fit: contain;
    border-radius: 6px;
    box-shadow: 0 18px 60px rgba(0, 0, 0, .65), 0 0 0 1px rgba(224, 164, 58, .25);
    cursor: pointer;
    opacity: 1;
    transition: opacity .35s ease;
    user-select: none;
    -webkit-user-drag: none;
  }
  #page.loading { opacity: 0; }

  /* ---- top-right switches ---- */
  #switches {
    position: absolute;
    top: 20px; right: 20px;
    display: flex; gap: 10px;
    z-index: 5;
  }
  .switch {
    width: 52px; height: 52px;
    padding: 0;
    border: 2px solid rgba(243, 234, 216, .35);
    border-radius: 50%;
    background: rgba(21, 19, 28, .72);
    color: var(--paper);
    cursor: pointer;
    overflow: hidden;
    display: grid; place-items: center;
    backdrop-filter: blur(4px);
  }
  .switch[aria-pressed="false"] { opacity: .5; }
  .switch[aria-pressed="true"] { border-color: var(--ember); }
  .switch img { width: 100%; height: 100%; object-fit: cover; }
  .switch svg { width: 26px; height: 26px; }
  .switch:focus-visible, .nav:focus-visible, .restart:focus-visible, #start:focus-visible {
    outline: 3px solid var(--ember); outline-offset: 3px;
  }

  /* ---- bottom navigation ---- */
  #ui {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    padding: 0 16px calc(env(safe-area-inset-bottom, 0px) + 4px);
  }
  .nav {
    width: 96px; height: 52px;
    border: 0; padding: 0;
    background: transparent;
    cursor: pointer;
    border-radius: 10px;
    display: grid; place-items: center;
  }
  #prev { justify-self: end; }
  #next { justify-self: start; }
  .nav img {
    width: 100%; height: 100%;
    object-fit: contain;
    mix-blend-mode: screen;      /* 讓箭頭圖的黑底融入背景 */
  }
  .nav:disabled { opacity: .2; cursor: default; }
  #status {
    min-width: 150px;
    text-align: center;
    font-size: 1.05rem;
    letter-spacing: .08em;
  }
  #status small { display: block; color: var(--muted); font-size: .78rem; letter-spacing: .04em; margin-top: 2px; }
  .restart {
    background: none; border: 0; color: var(--ember);
    font: inherit; font-size: .85rem; cursor: pointer; padding: 2px 6px;
    text-decoration: underline; text-underline-offset: 3px;
  }

  /* ---- start overlay ---- */
  #cover {
    position: fixed; inset: 0; z-index: 20;
    display: grid; place-items: center;
    background: rgba(21, 19, 28, .72);
    backdrop-filter: blur(6px);
  }
  #cover[hidden] { display: none; }
  #start {
    border: 2px solid var(--ember);
    background: var(--night);
    color: var(--paper);
    font: inherit; font-size: 1.4rem; letter-spacing: .18em;
    padding: 18px 44px;
    border-radius: 999px;
    cursor: pointer;
  }
  #start:hover { background: var(--ember); color: var(--night); }

  @media (max-width: 600px) {
    :root { --ui-h: 70px; }
    #stage { padding: 8px 8px 0; }
    .switch { width: 44px; height: 44px; }
    #switches { top: 14px; right: 14px; }
    .nav { width: 72px; }
    #status { min-width: 110px; }
  }
  @media (prefers-reduced-motion: reduce) {
    #page { transition: none; }
  }
</style>
</head>
<body>

<div id="app">
  <main id="stage">
    <div id="switches">
      <button class="switch" id="musicBtn" aria-pressed="true" aria-label="背景音樂 開／關" title="背景音樂">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/>
        </svg>
      </button>
      <button class="switch" id="readBtn" aria-pressed="true" aria-label="朗讀並自動翻頁 開／關" title="朗讀並自動翻頁">
        <img src="assets/graphics/read.jpg" alt="朗讀">
      </button>
    </div>
    <img id="page" alt="" draggable="false">
  </main>

  <nav id="ui" aria-label="翻頁">
    <button class="nav" id="prev" aria-label="上一頁"><img src="assets/graphics/left.jpg" alt="上一頁"></button>
    <div id="status" aria-live="polite"></div>
    <button class="nav" id="next" aria-label="下一頁"><img src="assets/graphics/right.jpg" alt="下一頁"></button>
  </nav>
</div>

<div id="cover">
  <button id="start">開始閱讀</button>
</div>

<script>
(() => {
  /* ===== 設定 ===== */
  const TOTAL = 20;                       // 共 20 頁（0–19）
  const img    = n => `assets/graphics/${n}.jpg`;
  const speech = n => `assets/speech/speech${n}.mp3`;
  const music  = n => `assets/music/music${n}.mp3`;
  const MUSIC_VOLUME = 0.35;
  const AUTO_TURN_DELAY = 900;            // 朗讀結束後，等待幾毫秒自動翻頁

  /* ===== 元素 ===== */
  const $ = id => document.getElementById(id);
  const pageEl = $('page'), statusEl = $('status');
  const prevBtn = $('prev'), nextBtn = $('next');
  const musicBtn = $('musicBtn'), readBtn = $('readBtn');
  const cover = $('cover');

  const voice = new Audio();
  const bgm = new Audio();
  bgm.loop = true;
  bgm.volume = MUSIC_VOLUME;

  let current = 0;
  let started = false;
  let musicOn = true;
  let readOn = true;
  let turnTimer = null;
  let loadToken = 0;

  /* ===== 顯示頁面 ===== */
  function show(n) {
    const token = ++loadToken;
    pageEl.classList.add('loading');
    const loader = new Image();
    loader.onload = loader.onerror = () => {
      if (token !== loadToken) return;
      pageEl.src = loader.src;
      pageEl.alt = `第 ${n + 1} 頁`;
      requestAnimationFrame(() => pageEl.classList.remove('loading'));
    };
    loader.src = img(n);
    // 預載下一頁
    if (n + 1 < TOTAL) new Image().src = img(n + 1);
  }

  function renderStatus() {
    const last = current === TOTAL - 1;
    statusEl.innerHTML = `${current + 1} / ${TOTAL}` +
      (last ? `<small><button class="restart" id="restart">回到封面</button></small>` : '');
    const r = $('restart');
    if (r) r.onclick = () => go(0);
    prevBtn.disabled = current === 0;
    nextBtn.disabled = last;
  }

  /* ===== 聲音 ===== */
  function safePlay(el) {
    const p = el.play();
    if (p && p.catch) p.catch(() => {});
  }

  function playSpeech() {
    clearTimeout(turnTimer);
    voice.pause();
    if (!started || !readOn) return;
    voice.src = speech(current);
    voice.currentTime = 0;
    safePlay(voice);
  }

  function playMusic() {
    if (!started) return;
    const src = new URL(music(current), location.href).href;
    if (bgm.src !== src) bgm.src = src;
    if (musicOn) safePlay(bgm); else bgm.pause();
  }

  voice.addEventListener('ended', () => {
    if (!readOn || current >= TOTAL - 1) return;
    turnTimer = setTimeout(() => go(current + 1), AUTO_TURN_DELAY);
  });

  /* ===== 翻頁 ===== */
  function go(n) {
    if (n < 0 || n >= TOTAL) return;
    clearTimeout(turnTimer);
    current = n;
    history.replaceState(null, '', '#' + (n + 1));
    show(n);
    renderStatus();
    playSpeech();
    playMusic();
  }

  /* ===== 事件 ===== */
  $('start').addEventListener('click', () => {
    started = true;
    cover.hidden = true;
    go(current);
  });

  prevBtn.addEventListener('click', () => go(current - 1));
  nextBtn.addEventListener('click', () => go(current + 1));

  // 點圖片 = 重新聽這一頁
  pageEl.addEventListener('click', () => {
    if (!started) return;
    const wasOff = !readOn;
    readOn = true;
    readBtn.setAttribute('aria-pressed', 'true');
    playSpeech();
    if (wasOff) readBtn.focus({ preventScroll: true });
  });

  musicBtn.addEventListener('click', () => {
    musicOn = !musicOn;
    musicBtn.setAttribute('aria-pressed', String(musicOn));
    playMusic();
  });

  readBtn.addEventListener('click', () => {
    readOn = !readOn;
    readBtn.setAttribute('aria-pressed', String(readOn));
    if (readOn) playSpeech();
    else { clearTimeout(turnTimer); voice.pause(); }
  });

  document.addEventListener('keydown', e => {
    if (!started) return;
    if (e.key === 'ArrowRight') go(current + 1);
    else if (e.key === 'ArrowLeft') go(current - 1);
  });

  // 手機滑動
  let tx = null;
  document.addEventListener('touchstart', e => { tx = e.touches[0].clientX; }, { passive: true });
  document.addEventListener('touchend', e => {
    if (tx === null || !started) return;
    const dx = e.changedTouches[0].clientX - tx;
    tx = null;
    if (Math.abs(dx) > 60) go(current + (dx < 0 ? 1 : -1));
  }, { passive: true });

  // 分頁切到背景時暫停聲音
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { voice.pause(); bgm.pause(); clearTimeout(turnTimer); }
    else if (started) { playMusic(); }
  });

  /* ===== 初始化（可用 #5 直接開到第 5 頁） ===== */
  const hash = parseInt(location.hash.slice(1), 10);
  if (hash >= 1 && hash <= TOTAL) current = hash - 1;
  show(current);
  renderStatus();
})();
</script>
</body>
</html>
